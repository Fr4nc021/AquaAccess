<section class="admin-view" id="view-configuracoes" hidden aria-labelledby="nav-configuracoes">
  <div class="admin-settings-shell">
    <header class="admin-settings-head">
      <div class="admin-settings-head__text">
        <h1 class="admin-view-head__title" id="config-page-title">Configurações</h1>
        <p class="admin-view-head__desc">Parâmetros gerais do sistema</p>
      </div>
    </header>

    <form id="form-device-settings" class="admin-settings-form admin-settings-form--page">
      <div class="admin-settings-panels admin-settings-stack">
        <article class="admin-panel admin-settings-card">
          <h2 class="admin-settings-card__title">Geral</h2>
          <div class="admin-settings-card__fields">
            <label class="admin-modal__field">
              <span class="admin-modal__label">Nome do clube</span>
              <input type="text" class="admin-modal__input" id="field-club-name" name="clubName" autocomplete="organization" />
            </label>
            <label class="admin-modal__field">
              <span class="admin-modal__label">Nome do sistema</span>
              <input type="text" class="admin-modal__input" id="field-system-name" name="systemName" autocomplete="off" />
            </label>
            <label class="admin-modal__field">
              <span class="admin-modal__label">Validade padrão de exame (dias)</span>
              <input
                type="number"
                class="admin-modal__input"
                id="field-exam-validity-days"
                name="defaultExamValidityDays"
                min="1"
                max="3650"
                inputmode="numeric"
              />
            </label>
          </div>
        </article>

        <article class="admin-panel admin-settings-card">
          <h2 class="admin-settings-card__title">Dispositivo Intelbras</h2>
          <div class="admin-settings-grid admin-settings-grid--device">
            <label class="admin-modal__field">
              <span class="admin-modal__label">IP do dispositivo</span>
              <input type="text" class="admin-modal__input" id="field-device-ip" name="ip" inputmode="decimal" autocomplete="off" />
            </label>
            <label class="admin-modal__field">
              <span class="admin-modal__label">Porta</span>
              <input type="text" class="admin-modal__input" id="field-device-port" name="devicePort" inputmode="numeric" autocomplete="off" />
            </label>
          </div>
          <div class="admin-settings-toggles" role="group" aria-label="Opções do dispositivo">
            <label class="admin-settings-toggle">
              <span class="admin-settings-toggle__label">Auto-sincronização a cada 5 minutos</span>
              <span class="admin-settings-toggle__switch">
                <input type="checkbox" class="admin-settings-toggle__input" id="toggle-auto-sync" name="autoSync5Min" />
                <span class="admin-settings-toggle__track" aria-hidden="true"></span>
              </span>
            </label>
            <label class="admin-settings-toggle">
              <span class="admin-settings-toggle__label">Bloquear automaticamente exames vencidos</span>
              <span class="admin-settings-toggle__switch">
                <input type="checkbox" class="admin-settings-toggle__input" id="toggle-block-expired" name="blockExpiredExams" />
                <span class="admin-settings-toggle__track" aria-hidden="true"></span>
              </span>
            </label>
          </div>
        </article>

        <article class="admin-panel admin-settings-card">
          <h2 class="admin-settings-card__title">Notificações</h2>
          <div class="admin-settings-toggles admin-settings-toggles--solo" role="group" aria-label="Preferências de notificação">
            <label class="admin-settings-toggle">
              <span class="admin-settings-toggle__label">Alertar 5 dias antes do vencimento</span>
              <span class="admin-settings-toggle__switch">
                <input type="checkbox" class="admin-settings-toggle__input" id="toggle-notify-5days" name="notify5DaysBefore" />
                <span class="admin-settings-toggle__track" aria-hidden="true"></span>
              </span>
            </label>
            <label class="admin-settings-toggle">
              <span class="admin-settings-toggle__label">Notificar tentativas de acesso negadas</span>
              <span class="admin-settings-toggle__switch">
                <input type="checkbox" class="admin-settings-toggle__input" id="toggle-notify-denied" name="notifyDeniedAccess" />
                <span class="admin-settings-toggle__track" aria-hidden="true"></span>
              </span>
            </label>
            <label class="admin-settings-toggle">
              <span class="admin-settings-toggle__label">Email diário com resumo operacional</span>
              <span class="admin-settings-toggle__switch">
                <input type="checkbox" class="admin-settings-toggle__input" id="toggle-daily-email" name="dailyEmailSummary" />
                <span class="admin-settings-toggle__track" aria-hidden="true"></span>
              </span>
            </label>
          </div>
        </article>
      </div>

      <div class="admin-settings-footer">
      <p id="device-settings-msg" class="admin-settings-msg admin-settings-msg--footer" hidden role="status"></p>
      <button type="submit" class="admin-settings-save-btn" id="btn-device-settings-save">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg>
        Salvar alterações
      </button>
    </div>
  </form>
  </div>
</section>
