<section class="admin-view" id="view-sincronizacao" hidden aria-labelledby="nav-sincronizacao">
  <header class="admin-view-head">
    <div class="admin-view-head__text">
      <h1 class="admin-view-head__title">Sincronização</h1>
      <p class="admin-view-head__desc">Banco local ↔ nuvem ↔ dispositivo</p>
    </div>
  </header>

  <div class="admin-sync-grid">
    <article class="admin-sync-card">
      <div class="admin-sync-card__icon admin-sync-card__icon--ok" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <ellipse cx="12" cy="5" rx="9" ry="3" />
          <path d="M3 5v6c0 1.7 4 3 9 3s9-1.3 9-3V5" />
          <path d="M3 11v6c0 1.7 4 3 9 3s9-1.3 9-3v-6" />
        </svg>
      </div>
      <p class="admin-sync-card__label">SQLite local</p>
      <p class="admin-sync-card__status" id="admin-sync-local-status">OK</p>
      <p class="admin-sync-card__meta" id="admin-sync-local-meta">—</p>
    </article>

    <article class="admin-sync-card">
      <div class="admin-sync-card__icon admin-sync-card__icon--ok" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" />
        </svg>
      </div>
      <p class="admin-sync-card__label">Supabase cloud</p>
      <p class="admin-sync-card__status" id="admin-sync-cloud-status">OK</p>
      <p class="admin-sync-card__meta" id="admin-sync-cloud-meta">Última sync: —</p>
    </article>

    <article class="admin-sync-card admin-sync-card--warn">
      <div class="admin-sync-card__icon admin-sync-card__icon--warn" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M4 12a8 8 0 0 1 8-8V2l4 3-4 3V7a6 6 0 0 0-6 6H4Z" />
          <path d="M20 12a8 8 0 0 1-8 8v2l-4-3 4-3v2a6 6 0 0 0 6-6h2Z" />
        </svg>
      </div>
      <p class="admin-sync-card__label">Pendências</p>
      <p class="admin-sync-card__status" id="admin-sync-pending-total">0</p>
      <p class="admin-sync-card__meta" id="admin-sync-pending-meta">Nenhuma pendência</p>
    </article>
  </div>

  <div class="admin-panel admin-sync-panel">
    <div class="admin-sync-panel__head">
      <div class="admin-sync-panel__titles">
        <h2 class="admin-panel__title">Sincronizar agora</h2>
        <p class="admin-panel__subtitle" id="admin-sync-last-full">Última sincronização completa: —</p>
      </div>
      <button type="button" class="admin-reports__btn admin-reports__btn--primary" id="btn-admin-sync-all">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M4 12a8 8 0 0 1 8-8V2l4 3-4 3V7a6 6 0 0 0-6 6H4Z" />
          <path d="M20 12a8 8 0 0 1-8 8v2l-4-3 4-3v2a6 6 0 0 0 6-6h2Z" />
        </svg>
        Sincronizar tudo
      </button>
    </div>
    <p id="admin-sync-msg" class="admin-sync-msg" hidden role="status" aria-live="polite"></p>
    <div class="admin-sync-detail-grid">
      <div class="admin-sync-detail" data-admin-sync-detail="pacientes">
        <span class="admin-sync-detail__icon admin-sync-detail__icon--ok" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
        <div class="admin-sync-detail__text">
          <span class="admin-sync-detail__name">Pacientes</span>
          <span class="admin-sync-detail__state" id="admin-sync-detail-pacientes">Sincronizado</span>
        </div>
      </div>
      <div class="admin-sync-detail" data-admin-sync-detail="exames">
        <span class="admin-sync-detail__icon admin-sync-detail__icon--ok" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
        <div class="admin-sync-detail__text">
          <span class="admin-sync-detail__name">Exames</span>
          <span class="admin-sync-detail__state" id="admin-sync-detail-exames">Sincronizado</span>
        </div>
      </div>
      <div class="admin-sync-detail" data-admin-sync-detail="fotos">
        <span class="admin-sync-detail__icon admin-sync-detail__icon--ok" id="admin-sync-icon-fotos" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
        <div class="admin-sync-detail__text">
          <span class="admin-sync-detail__name">Fotos</span>
          <span class="admin-sync-detail__state" id="admin-sync-detail-fotos">Sincronizado</span>
        </div>
      </div>
      <div class="admin-sync-detail" data-admin-sync-detail="logs">
        <span class="admin-sync-detail__icon admin-sync-detail__icon--ok" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
        <div class="admin-sync-detail__text">
          <span class="admin-sync-detail__name">Logs de acesso</span>
          <span class="admin-sync-detail__state" id="admin-sync-detail-logs">Sincronizado</span>
        </div>
      </div>
    </div>
  </div>
</section>
